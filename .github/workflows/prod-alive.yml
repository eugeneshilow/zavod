name: prod-alive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  alive:
    runs-on: ubuntu-latest
    steps:
      - name: production answers 200
        run: |
          test -n "${{ vars.PROD_URL }}" || { echo "PROD_URL is not set"; exit 1; }
          curl -fsS -o /dev/null --max-time 30 "${{ vars.PROD_URL }}"
